<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportCam Go</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #1e2326;
  color: white;
}

/* ===== SECTION BASE ===== */
.section {
  padding: 80px 20px;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

/* ===== VIEWER ===== */
.viewer-section {
  background: linear-gradient(180deg, #23282c 0%, #1e2326 100%);
}

.viewer-wrap {
  position: relative;
  max-width: 600px;
  margin: 40px auto;
  cursor: grab;
}

.viewer-canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  border-radius: 20px;
  overflow: hidden;
  background: #f3f3f3;
}

.viewer-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.viewer-frame.active {
  opacity: 1;
}

.viewer-dots {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

.viewer-dot {
  width: 10px;
  height: 10px;
  background: #888;
  border-radius: 50%;
  cursor: pointer;
}

.viewer-dot.active {
  background: #a7e803;
}

.viewer-hint {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  background: rgba(0,0,0,0.6);
  padding: 6px 12px;
  border-radius: 20px;
}

/* ===== CTA ===== */
.cta {
  margin-top: 40px;
}

button {
  background: #a7e803;
  border: none;
  padding: 14px 24px;
  font-weight: bold;
  cursor: pointer;
}
</style>

</head>

<body>

<!-- HERO -->
<section class="section">
  <div class="container">
    <h1>Record every match. Effortlessly.</h1>
    <p>Set it up, press record and focus on your team.</p>
    <div class="cta">
      <button>Get early access</button>
    </div>
  </div>
</section>

<!-- VIEWER -->
<section class="section viewer-section">
  <div class="container">
    <h2>See SportCam Go from every angle</h2>
    <p>Compact. Portable. Built for real football environments.</p>

    <div class="viewer-wrap" id="viewer">
      <div class="viewer-canvas">
        <img class="viewer-frame active" src="img1.jpg">
        <img class="viewer-frame" src="img2.jpg">
        <img class="viewer-frame" src="img3.jpg">
        <img class="viewer-frame" src="img4.jpg">

        <div class="viewer-hint">Drag or tap to rotate</div>
      </div>

      <div class="viewer-dots">
        <div class="viewer-dot active" data-index="0"></div>
        <div class="viewer-dot" data-index="1"></div>
        <div class="viewer-dot" data-index="2"></div>
        <div class="viewer-dot" data-index="3"></div>
      </div>
    </div>

    <div class="cta">
      <button>Request early access</button>
    </div>
  </div>
</section>

<script>
const frames = document.querySelectorAll(".viewer-frame");
const dots = document.querySelectorAll(".viewer-dot");

let current = 0;

function updateViewer(index) {
  frames.forEach((f, i) => {
    f.classList.toggle("active", i === index);
  });

  dots.forEach((d, i) => {
    d.classList.toggle("active", i === index);
  });

  current = index;
}

dots.forEach(dot => {
  dot.addEventListener("click", () => {
    updateViewer(parseInt(dot.dataset.index));
  });
});

let startX = 0;

document.getElementById("viewer").addEventListener("mousedown", e => {
  startX = e.clientX;
});

document.addEventListener("mouseup", e => {
  let diff = e.clientX - startX;

  if (Math.abs(diff) > 50) {
    if (diff > 0) {
      updateViewer((current - 1 + frames.length) % frames.length);
    } else {
      updateViewer((current + 1) % frames.length);
    }
  }
});
</script>

</body>
</html>
